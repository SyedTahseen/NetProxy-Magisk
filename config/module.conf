# NetProxy module settings
# Auto-start the service on boot (1=enabled, 0=disabled)
AUTO_START=1
# Outbound mode (rule=rule-based routing, global=global proxy, direct=global direct)
OUTBOUND_MODE=rule
# OnePlus Android 16 fix (1=enabled, 0=disabled)
ONEPLUS_A16_FIX=0
# Path of the config file currently in use
CURRENT_CONFIG="/data/adb/modules/netproxy/config/xray/outbounds/default/default.json"
