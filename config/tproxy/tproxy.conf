# TProxy transparent proxy configuration file
# This file is loaded by the tproxy.sh script

# ===================== Proxy core settings =====================
# User and group the proxy process runs as
CORE_USER_GROUP="root:net_admin"
# Proxy traffic mark
ROUTING_MARK=""
# Force mark bypass (0: disabled, 1: enabled)
FORCE_MARK_BYPASS=0
# Transparent proxy listening port
PROXY_TCP_PORT="12345"
PROXY_UDP_PORT="12345"

# Proxy mode: 0=auto-detect, 1=force TPROXY, 2=force REDIRECT
PROXY_MODE=0

# Performance mode (0: disabled, 1: enabled, optimizes TPROXY rules)
PERFORMANCE_MODE=0

# ===================== DNS settings =====================
# DNS hijack method (0: disabled, 1: tproxy, 2: redirect)
DNS_HIJACK_ENABLE=1
# DNS listening port
DNS_PORT="1053"

# ===================== Network interface definitions =====================
# Mobile data interface
MOBILE_INTERFACE="rmnet_data+"
# WiFi interface
WIFI_INTERFACE="wlan0"
# Hotspot interface
HOTSPOT_INTERFACE="wlan2"
# USB tethering interface
USB_INTERFACE="rndis+"
# Other interfaces to proxy (space-separated)
OTHER_PROXY_INTERFACES=""
# Other interfaces to bypass (space-separated)
OTHER_BYPASS_INTERFACES=""

# ===================== Proxy switches =====================
PROXY_MOBILE=1
PROXY_WIFI=1
PROXY_HOTSPOT=0
PROXY_USB=0
PROXY_TCP=1
PROXY_UDP=1
# IPv6 proxy control:
#  0 = proxy disabled (but the IPv6 stack stays active)
#  1 = proxy enabled (normal IPv6 proxying)
# -1 = force-disable the IPv6 stack (sets disable_ipv6=1 on all interfaces)
PROXY_IPV6=0

# ===================== Hotspot subnet settings =====================
# Hotspot subnet used when WiFi and hotspot share the same interface (common on older devices)
# Only used when HOTSPOT_INTERFACE == WIFI_INTERFACE
HOTSPOT_SUBNET_IPV4="192.168.43.0/24"
HOTSPOT_SUBNET_IPV6="fe80::/10"

# ===================== IP list settings =====================
# Bypass list for local reserved and private addresses
# Note: 100.0.0.0/8 includes carrier-grade NAT (100.64.0.0/10)
# Note: common IPv6 prefixes of China's three major carriers are bypassed by default: 2409:8000::/20 2408:8000::/20 240e::/18
BYPASS_IPv4_LIST="0.0.0.0/8 10.0.0.0/8 100.0.0.0/8 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 255.255.255.255/32"
BYPASS_IPv6_LIST="::/128 ::1/128 ::ffff:0:0/96 100::/64 64:ff9b::/96 2001::/32 2001:10::/28 2001:20::/28 2001:db8::/32 2002::/16 fe80::/10 ff00::/8 2409:8000::/20 2408:8000::/20 240e::/18"

# IP list to force through the proxy (leave empty to disable)
PROXY_IPv4_LIST=""
PROXY_IPv6_LIST=""

# ===================== Mark values =====================
MARK_VALUE=20
MARK_VALUE6=25

# ===================== Routing table IDs =====================
TABLE_ID=2025

# ===================== Per-app proxy =====================
# Enable per-app proxy (0: disabled, 1: enabled)
APP_PROXY_ENABLE=1
# Proxied app list (space-separated, supports user:package format)
PROXY_APPS_LIST=""
# Bypassed app list (space-separated)
BYPASS_APPS_LIST=""
# Per-app mode ("blacklist" or "whitelist")
APP_PROXY_MODE="blacklist"

# ===================== China IP bypass =====================
BYPASS_CN_IP=0
# CN IP list file path (relative to the script directory)
CN_IP_FILE="cn.zone"
CN_IPV6_FILE="cn_ipv6.zone"
# CN IP source URL
CN_IP_URL="https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt"
CN_IPV6_URL="https://ispip.clang.cn/all_cn_ipv6.txt"

# ===================== MAC address filtering (hotspot mode) =====================
MAC_FILTER_ENABLE=0
PROXY_MACS_LIST=""
BYPASS_MACS_LIST=""
MAC_PROXY_MODE="blacklist"

# ===================== QUIC blocking =====================
# Block QUIC (UDP 443) (0: disabled, 1: enabled)
BLOCK_QUIC=0

# ===================== Debug mode =====================
DRY_RUN=0
