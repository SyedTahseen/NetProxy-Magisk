name: Build module

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts and configs
        run: |
          set -euo pipefail
          for f in customize.sh service.sh action.sh scripts/cli $(find scripts -name '*.sh'); do
            sh -n "$f" || { echo "::error file=$f::shell syntax error"; exit 1; }
          done
          for f in $(find config -name '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Download the latest Xray (Android arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)
          echo "XRAY_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Latest Xray release: $TAG"

          mkdir -p /tmp/xray
          gh release download "$TAG" --repo XTLS/Xray-core \
            --pattern 'Xray-android-arm64-v8a.zip' \
            --pattern 'Xray-android-arm64-v8a.zip.dgst' \
            --dir /tmp/xray

          expected=$(grep -iE '^SHA(2-)?256' /tmp/xray/Xray-android-arm64-v8a.zip.dgst | head -1 | sed 's/.*= *//' | tr -d '[:space:]' || true)
          actual=$(sha256sum /tmp/xray/Xray-android-arm64-v8a.zip | cut -d' ' -f1)
          if [ -z "$expected" ]; then
            echo "::warning::Could not read the SHA-256 from the .dgst file, skipping checksum verification"
          elif [ "${expected,,}" != "$actual" ]; then
            echo "::error::Checksum mismatch (expected $expected, got $actual)"
            exit 1
          fi

          unzip -oq /tmp/xray/Xray-android-arm64-v8a.zip xray -d /tmp/xray
          install -m 755 /tmp/xray/xray bin/xray
          file bin/xray | tee /dev/stderr | grep -q 'ARM aarch64'

      - name: Stage the module files
        run: |
          set -euo pipefail
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          NAME="NetProxy_${VERSION}_${CODE}_xray-${XRAY_TAG}"
          echo "ZIP_NAME=${NAME}.zip" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"
          mkdir dist
          tar --exclude=./.git --exclude=./.github --exclude=./.gitignore --exclude=./dist --exclude='*.zip' -cf - . | tar -xf - -C dist
          ls -lh dist/bin
          test -f dist/module.prop && test -f dist/customize.sh && test -x dist/bin/xray
          echo "### Built \`${NAME}\` with Xray \`$XRAY_TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (download it and flash directly)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          compression-level: 6

      - name: Zip module
        run: cd dist && zip -q -r -9 -X "../${ZIP_NAME}" .

      - name: Send zip to Telegram
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skipping Telegram upload"
            exit 0
          fi

          SIZE=$(stat -c%s "${ZIP_NAME}")
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::warning::${ZIP_NAME} is larger than 50 MB, Telegram bots cannot upload it"
            exit 0
          fi

          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          CAPTION="NetProxy build
          Xray: ${XRAY_TAG}
          Commit: ${GITHUB_SHA::7}
          ${FIRST_LINE}"

          RESP=$(curl -sS --max-time 300 \
            -F "chat_id=${TG_CHAT_ID}" \
            -F "caption=${CAPTION}" \
            -F "document=@${ZIP_NAME}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument") || {
              echo "::warning::curl failed while contacting Telegram"; exit 0; }

          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Sent ${ZIP_NAME} to Telegram"
          else
            echo "::warning::Telegram rejected the upload: $(echo "$RESP" | sed 's/.*"description":"\([^"]*\)".*/\1/')"
          fi

      - name: Attach to GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
